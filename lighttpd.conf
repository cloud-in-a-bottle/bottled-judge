server.document-root = "/srv"
server.port = 8080
server.username = "web-server"
server.groupname = "web-server"
server.modules += ("mod_cgi", "mod_rewrite", "mod_setenv")
cgi.assign = (".cgi" => "")
url.rewrite-once = ("^/(.*)$" => "/web.cgi/$1")
setenv.set-environment = ("OPENHOST_APP_DATA_DIR" => env.OPENHOST_APP_DATA_DIR)
server.max-request-size = 4096
